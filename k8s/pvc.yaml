apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chroma-data
  namespace: slack-agent
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: state-data
  namespace: slack-agent
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
